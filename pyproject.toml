[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applescript-decompiler"
version = "2.0.1"
description = "A decompiler for run-only applescripts"
authors = [{name = "pberba"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # pinned to this release: the decompiler needs the disassembler it ships with
  "jinmo-applescript-disassembler @ git+https://github.com/pberba/applescript-decompiler@v2.0.1#subdirectory=jinmo_applescript_disassembler",
]

[project.urls]
Homepage = "https://github.com/pberba/applescript-decompiler"

[project.scripts]
applescript_decompile = "applescript_decompiler.decompiler:cli"

[tool.setuptools]
packages = ["applescript_decompiler"]

[tool.setuptools.package-data]
applescript_decompiler = ["data/*.sdef"]

[tool.uv.sources]
jinmo-applescript-disassembler = { path = "jinmo_applescript_disassembler" }

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# run from a checkout without installing either package
pythonpath = [".", "jinmo_applescript_disassembler"]
